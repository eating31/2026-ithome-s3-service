name: Deploy S3 Microservice to EC2

on:
  push:
    branches: [ "main" ]  # 當 main 分支有 git push 時自動觸發

env:
  ECR_REPOSITORY: 2026ithome/s3-service  # ECR URL 中 registry 後面的部分

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v3

    - name: 2. Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 3. Build & Package (skip tests - no test cases defined)
      # 如果之後補了測試，把 -DskipTests 拿掉
      run: mvn package -DskipTests
      working-directory: s3-service

    - name: 4. Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: 5. Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: 6. Build & Push Docker Image to ECR (latest)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # 固定用 latest tag 覆蓋，避免 ECR 儲存空間累積收費
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f s3-service/Dockerfile s3-service
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: 7. Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      env:
        # 先把 registry output 存成 env，才能在 SSH script 裡使用
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      with:
        host: 100.57.94.146   # EC2 Public IP，建議放 Secret 而非寫死
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY,ECR_REPOSITORY  # 把上面宣告的 env 傳進 SSH script
        script: |
          # 1. 依靠 EC2 綁定的 IAM Role 自動登入 ECR（不需要 AK/SK）
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

          # 2. 拉取最新 image
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # 3. 停掉舊容器（不存在時不報錯）、啟動新容器
          docker stop s3-app || true
          docker rm s3-app || true
          docker run -d \
            -p 8080:8080 \
            --name s3-app \
            --restart always \
            -e AWS_ACCESS_KEY_ID="${{ secrets.S3_AK }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.S3_SK }}" \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
