name: Deploy S3 Microservice to K8s

on:
  push:
    branches: [ "main" ]  # 當 main 分支有 git push 時自動觸發

env:
  ECR_REPOSITORY: 2026ithome/s3-service  # ECR URL 中 registry 後面的部分

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v3

    - name: 2. Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 3. Build & Package (skip tests - no test cases defined)
      # 如果之後補了測試，把 -DskipTests 拿掉改回 mvn test && mvn package -DskipTests
      run: mvn package -DskipTests
      working-directory: s3-service  # ← Dockerfile 和 pom.xml 都在這個子目錄

    - name: 4. Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # ECR 所在的 Region

    - name: 5. Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: 6. Build & Push Docker Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}  # 使用 Git Commit SHA 作為唯一版號
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f s3-service/Dockerfile s3-service
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

